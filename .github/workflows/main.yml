name: Build Noun Star APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Lucide and Cairo font for offline use
        run: bash prepare.sh

      - name: Clean resources
        run: |
          find app/src/main/res -type f ! -name '*.png' ! -name '*.xml' -print -delete
          if [ ! -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            echo "Icons missing, building without custom icon"
            sed -i 's| android:icon="@mipmap/ic_launcher"||; s| android:roundIcon="@mipmap/ic_launcher_round"||' app/src/main/AndroidManifest.xml
          fi

      - name: Create theme resources
        run: |
          mkdir -p app/src/main/res/values
          printf '%s\n' '<resources><color name="bg">#050505</color></resources>' > app/src/main/res/values/colors.xml
          printf '%s\n' '<resources><style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowBackground">@color/bg</item><item name="android:statusBarColor">@color/bg</item><item name="android:navigationBarColor">@color/bg</item></style></resources>' > app/src/main/res/values/styles.xml

      - name: Fix Kotlin duplicate classes
        run: |
          printf '\n%s\n' "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> app/build.gradle
          tail -n 3 app/build.gradle

      - name: Build debug APK
        run: gradle assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NounStar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
