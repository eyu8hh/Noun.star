name: Build Noun Star APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Lucide and Cairo font for offline use
        run: bash prepare.sh

      - name: Clean resources
        run: |
          find app/src/main/res -type f ! -name '*.png' ! -name '*.xml' -print -delete
          if [ ! -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            echo "Icons missing, building without custom icon"
            sed -i 's| android:icon="@mipmap/ic_launcher"||; s| android:roundIcon="@mipmap/ic_launcher_round"||' app/src/main/AndroidManifest.xml
          fi

      - name: Verify offline assets
        run: |
          ls -l app/src/main/assets/www
          ls -l app/src/main/assets/www/fonts

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NounStar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
