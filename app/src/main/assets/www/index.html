<style>
:root{--p:#172DC4;--k:#050505;--l:#E8ECFF;--bg:#F4F6FF;--c:#fff;--t:#050505;--m:#586071;--b:#dfe3f5;--ok:#16a34a;--er:#dc2626;--wa:#d97706;--sh:0 4px 18px rgba(23,45,196,.12)}

*{box-sizing:border-box;margin:0;font-family:Cairo,system-ui,sans-serif}
html,body{height:100%}body{background:var(--bg);color:var(--t);font-size:14px}
#app{max-width:760px;margin:auto;min-height:100%;padding:0 max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:10px;padding:clamp(2px,.6vh,6px) 0 clamp(8px,1.5vh,12px)}
header img{width:34px;height:34px;border-radius:50%}header h1{font-size:17px;font-weight:800;flex:1}
.card{background:var(--c);border-radius:16px;padding:11px;box-shadow:var(--sh);margin-bottom:10px;border:1px solid var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin-bottom:10px}.st{min-width:0}
.st{background:var(--c);border-radius:14px;padding:8px 12px;border:1px solid var(--b);box-shadow:var(--sh)}.st b{display:block;overflow-wrap:anywhere;font-size:clamp(17px,5.2vw,23px);color:var(--p)}[data-theme=dark] .st b{color:#8ea0ff}.st span{color:var(--m);font-size:11px}
h2{font-size:15px;margin:12px 0 6px}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:8px 13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:13px}.btn.s{background:var(--l);color:var(--p)}.btn.d{background:var(--er)}.btn.sm{padding:6px 10px;font-size:12px}
[data-theme=dark] .btn.s{color:#fff}
.ib{background:var(--l);border:0;border-radius:12px;width:34px;height:34px;display:grid;place-items:center;color:var(--p);cursor:pointer}[data-theme=dark] .ib{color:#fff}
.row{display:flex;align-items:center;gap:10px}.row.w{flex-wrap:wrap}.sp{flex:1;min-width:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.bd{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--l);color:var(--p);font-weight:600;white-space:nowrap}[data-theme=dark] .bd{color:#fff}.bd.ok{background:#dcfce7;color:#166534}.bd.er{background:#fee2e2;color:#991b1b}.bd.wa{background:#fef3c7;color:#92400e}
.m{color:var(--m);font-size:12px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:14px}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px}label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto}
#top{position:sticky;top:0;z-index:8;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + clamp(8px,2vh,18px))}nav{display:block;background:var(--c);border:1px solid var(--b);border-radius:16px;padding:4px;margin-bottom:clamp(10px,1.6vh,14px);box-shadow:var(--sh)}nav div{display:flex;gap:2px;width:100%}nav button{flex:1 1 0;min-width:0;background:0;border:0;color:var(--m);padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:clamp(10px,2.9vw,12px);line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}nav button svg{width:clamp(18px,5.4vw,22px);height:clamp(18px,5.4vw,22px);flex:none;display:block}nav button.on{background:var(--p);color:#fff;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:f .2s}
.md{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px;animation:u .25s}@media(min-width:600px){.ov{align-items:center}.md{border-radius:22px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ac{display:flex;gap:8px;margin-top:14px}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(40px)}}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:8px;border-radius:12px;border:0;background:var(--l);color:var(--p);font-weight:600;cursor:pointer}.tabs button.on{background:var(--p);color:#fff}
.emp{text-align:center;padding:36px 10px;color:var(--m)}.emp i{width:48px;height:48px;color:var(--p)}.emp p{margin:8px 0 14px}
.bar{height:10px;border-radius:6px;background:var(--l);overflow:hidden;display:flex}.bar i{display:block;height:100%}

#splash img{width:160px;height:160px;animation:z 1.2s ease-out}#splash h1{letter-spacing:3px;font-weight:800;animation:f 1.4s}#splash p{color:#E8ECFF;animation:f 1.8s}#splash small{color:#8ea0ff;direction:ltr;margin-top:18px;animation:f 2.2s}

#lock{display:none}#lock input{max-width:220px;text-align:center;font-size:24px;letter-spacing:8px}

function showLedger(){const m=modal('السجل المالي',`<div class="row"><input class="sp" type="month" id="lm" value="${ym()}" aria-label="الشهر"><select id="lt" style="width:110px" aria-label="النوع"><option value="">الكل</option><option value="in">إيرادات</option><option value="out">مصاريف</option></select></div><div id="led"></div><button type="button" class="btn s sm" id="lc">تصدير CSV</button>`,null);let cur=[];
 const draw=()=>{const v=m.querySelector('#lm').value,k=m.querySelector('#lt').value;cur=ledger().filter(e=>e.date.startsWith(v)&&(!k||(k==='in')===!!e.inc));const a=cur.filter(e=>!e.void),i=a.filter(e=>e.inc).reduce((n,e)=>n+e.amt,0),o=a.filter(e=>!e.inc).reduce((n,e)=>n+e.amt,0);
  m.querySelector('#led').innerHTML=`<p class="m">إيرادات ${money(i)} · مصاريف ${money(o)} · صافي ${money(i-o)}</p>`+(cur.map(e=>`<div class="card row" style="${e.void?'opacity:.5':''}"><div class="sp"><b style="${e.void?'text-decoration:line-through':''}">${esc(e.title)}</b><div class="m">${e.date} · ${esc(e.sub)}</div></div><b style="color:var(--${e.inc?'ok':'er'})">${e.inc?'+':'−'}${money(e.amt)}</b>${e.void?'<span class="bd er">ملغاة</span>':`<button type="button" class="ib x" data-x="${e.id}" data-s="${e.st}" aria-label="إلغاء العملية">${ic('x')}</button>`}</div>`).join('')||'<p class="m">لا توجد عمليات</p>');icons()};
 draw();m.querySelector('#lm').oninput=m.querySelector('#lt').onchange=draw;
 m.querySelector('#led').onclick=async e=>{const b=e.target.closest('[data-x]');if(!b||!await ask('إلغاء هذه العملية؟ تبقى مشطوبة في السجل ولا تُحسب في الرصيد.'))return;try{await voidEntry(b.dataset.s,b.dataset.x);draw();R()}catch(x){toast(x.message,'er')}};
 m.querySelector('#lc').onclick=()=>dl([['التاريخ','النوع','البيان','التفاصيل','المبلغ','الحالة']].concat(cur.map(e=>[e.date,e.inc?'إيراد':'مصروف',e.title,e.sub,e.amt,e.void?'ملغاة':'سارية'])).map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'ledger.csv','text/csv')}
function repData(mode,v){const T=S.transactions.filter(t=>!t.void),E=S.expenses.filter(e=>!e.void),a=t=>num(t.amount),sum=L=>L.reduce((n,t)=>n+a(t),0);
 if(mode==='m'){const ti=T.filter(t=>t.date.startsWith(v)),inc=sum(ti),oth=sum(ti.filter(t=>t.kind==='other')),ex=E.filter(e=>e.date.startsWith(v)),exp=sum(ex),dm=S.payments.filter(p=>p.month===v&&p.state!=='exempt'),due=dm.reduce((n,p)=>n+num(p.due),0),pd=dm.reduce((n,p)=>n+num(p.paid),0),prev=S.payments.filter(p=>p.month<v&&p.state!=='exempt').reduce((n,p)=>n+Math.max(num(p.due)-num(p.paid),0),0),bc={};ex.forEach(e=>bc[e.category]=(bc[e.category]||0)+a(e));
  return[['البند','المبلغ'],['إيرادات الاشتراكات',inc-oth],['إيرادات أخرى',oth],['إجمالي الإيرادات',inc],['إجمالي المصاريف',exp],['الصافي',inc-exp],['مستحقات الشهر',due],['المحصّل من مستحقات الشهر',pd],['متبقي الشهر',Math.max(due-pd,0)],['متأخرات الأشهر السابقة',prev],...Object.entries(bc).map(([k,x])=>['مصاريف: '+k,x])]}
 const rows=[['الشهر','الإيرادات','المصاريف','الصافي']];let ti=0,te=0;for(let i=1;i<=12;i++){const p=v+'-'+String(i).padStart(2,'0'),x=sum(T.filter(t=>t.date.startsWith(p))),y=sum(E.filter(e=>e.date.startsWith(p)));ti+=x;te+=y;rows.push([MN[i-1],x,y,x-y])}
 rows.push(['الإجمالي',ti,te,ti-te]);rows.push(['متأخرات حتى الآن',arrears().a,'','']);return rows}

 const sw=k=>{mode=k;m.querySelector('#rm').classList.toggle('on',k==='m');m.querySelector('#ry').classList.toggle('on',k==='y');m.querySelector('#rp').style.display=k==='m'?'':'none';m.querySelector('#rs').style.display=k==='y'?'':'none';draw()};
 m.querySelector('#rm').onclick=()=>sw('m');m.querySelector('#ry').onclick=()=>sw('y');m.querySelector('#rp').oninput=m.querySelector('#rs').onchange=draw;

/* ===== Backup / Restore / Export ===== */
async function backup(){const data={};STORES.forEach(s=>data[s]=S[s]);const body=JSON.stringify(data),file={app:'NOUNSTAR',version:1,date:new Date().toISOString(),checksum:await sha(body),data};dl(JSON.stringify(file),`nounstar-backup-${today()}.json`,'application/json');await log('إنشاء نسخة احتياطية','sys',{label:''});toast('تم إنشاء النسخة الاحتياطية')}
async function restore(f){if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='NOUNSTAR'||j.version!==1||!j.data)bad('ملف غير صالح');if(await sha(JSON.stringify(j.data))!==j.checksum)bad('الملف تالف: فشل التحقق من checksum');if(!['categories','players','matches','payments','settings'].every(s=>Array.isArray(j.data[s])))bad('بنية الملف غير صحيحة');
 if(!await ask('تحذير: سيتم استبدال كل البيانات الحالية بمحتوى الملف ولا يمكن التراجع. هل تريد المتابعة؟'))return;for(const s of STORES){await tx(s,'readwrite',o=>o.clear());for(const r of j.data[s]||[])await tx(s,'readwrite',o=>o.put(r))}await load();await migrate();await log('استعادة نسخة احتياطية','sys',{label:f.name});R();toast('تمت الاستعادة')}catch(e){toast(e.message||'ملف غير صالح','er')}$('#rf').value=''}
function dl(txt,name,type){if(window.Android){Android.saveFile(name,type,'\ufeff'+txt);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type}));a.download=name;a.click()}
function csv(){const r=[['الاسم','الفئة','الرقم','المركز','الحالة','الهاتف','ولي الأمر','الأهداف','التمريرات','المباريات']].concat(S.players.map(p=>{const s=pStats(p.id);return[p.name,catName(p.cat),p.jersey,p.pos,p.status,p.phone,p.gphone,s.g,s.a,s.m]}));dl(r.map(x=>x.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'players.csv','text/csv')}

['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{if($('#lock').style.display!=='flex')idle()}));
