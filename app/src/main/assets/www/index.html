<style>

*{box-sizing:border-box;margin:0;font-family:Cairo,system-ui,sans-serif}
html,body{height:100%}body{background:var(--bg);color:var(--t);font-size:15px}
#app{max-width:760px;margin:auto;min-height:100%;padding:0 14px calc(86px + env(safe-area-inset-bottom,0))}
header{display:flex;align-items:center;gap:10px;padding:4px 0 6px;position:sticky;top:env(safe-area-inset-top,0);background:var(--bg);z-index:5}
header img{width:34px;height:34px;border-radius:50%}header h1{font-size:17px;font-weight:800;flex:1}
.card{background:var(--c);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:12px;border:1px solid var(--b)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--c);border-radius:18px;padding:12px;border:1px solid var(--b);box-shadow:var(--sh)}.st b{display:block;font-size:24px;color:var(--p)}[data-theme=dark] .st b{color:#8ea0ff}.st span{color:var(--m);font-size:12px}
h2{font-size:16px;margin:14px 0 8px}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:14px}.btn.s{background:var(--l);color:var(--p)}.btn.d{background:var(--er)}.btn.sm{padding:6px 10px;font-size:12px}
[data-theme=dark] .btn.s{color:#fff}
.ib{background:var(--l);border:0;border-radius:12px;width:38px;height:38px;display:grid;place-items:center;color:var(--p);cursor:pointer}[data-theme=dark] .ib{color:#fff}
.row{display:flex;align-items:center;gap:10px}.row.w{flex-wrap:wrap}.sp{flex:1;min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.bd{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--l);color:var(--p);font-weight:600;white-space:nowrap}[data-theme=dark] .bd{color:#fff}.bd.ok{background:#dcfce7;color:#166534}.bd.er{background:#fee2e2;color:#991b1b}.bd.wa{background:#fef3c7;color:#92400e}
.m{color:var(--m);font-size:12px}

label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px}label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:f .2s}

.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ac{display:flex;gap:8px;margin-top:14px}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(40px)}}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:8px;border-radius:12px;border:0;background:var(--l);color:var(--p);font-weight:600;cursor:pointer}.tabs button.on{background:var(--p);color:#fff}
.emp{text-align:center;padding:36px 10px;color:var(--m)}.emp i{width:48px;height:48px;color:var(--p)}.emp p{margin:8px 0 14px}
