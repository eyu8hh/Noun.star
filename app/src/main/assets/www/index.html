 if(st==='users'&&o&&old&&o.id===u.id&&o.name===old.name&&o.role===old.role&&o.active===old.active&&JSON.stringify(o.cats)===JSON.stringify(old.cats)&&JSON.stringify(o.perms)===JSON.stringify(old.perms))return;

VAL.users=o=>{if(!o.name?.trim())bad('اسم المستخدم مطلوب');if(S.users.some(x=>x.id!==o.id&&x.name.trim()===o.name.trim()))bad('اسم المستخدم مكرر');if(!ROLES.includes(o.role))bad('دور غير صحيح');if(!o.hash||!o.salt)bad('الرمز مطلوب');if(o.role==='مدرب'&&!(o.cats||[]).length)bad('اختر فئة واحدة على الأقل للمدرب');(o.cats||[]).forEach(c=>{if(!S.categories.some(x=>x.id===c))bad('فئة غير موجودة')});

const genCode=()=>{const a=new Uint32Array(12),A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';crypto.getRandomValues(a);const s=[...a].map(x=>A[x%A.length]).join('');return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8)};

function showLogin(){const L=$('#lock'),us=S.users.filter(u=>u.active);document.querySelectorAll('.ov').forEach(o=>o.remove());L.style.display='flex';L.innerHTML=`<img src="${LOGO}" width="90" height="90" style="border-radius:50%" alt=""><h2>تسجيل الدخول</h2><select id="lu" aria-label="المستخدم" style="max-width:240px">${us.map(u=>`<option value="${u.id}">${esc(u.name)} — ${u.role}</option>`).join('')}</select><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="الرمز" style="max-width:240px;text-align:center;font-size:22px;letter-spacing:8px"><button class="btn" id="lb">دخول</button><button class="btn s sm" id="lf">نسيت الرمز؟ (المدير)</button>`;$('#lb').onclick=doLogin;$('#lp').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#lf').onclick=recover}

function recover(){const L=$('#lock');L.innerHTML=`<h2>استرداد حساب المدير</h2><input id="rcd" placeholder="رمز الاسترداد" style="max-width:240px;direction:ltr;text-align:center" autocomplete="off" aria-label="رمز الاسترداد"><input id="rpn" type="password" inputmode="numeric" maxlength="6" placeholder="رمز جديد" style="max-width:240px;text-align:center" aria-label="الرمز الجديد"><button class="btn" id="rgo">تعيين</button><button class="btn s sm" id="rbk">رجوع</button>`;$('#rbk').onclick=showLogin;
 $('#rgo').onclick=async()=>{try{if(Date.now()<LOCKU)bad('محاولات كثيرة. انتظر قليلًا');const code=$('#rcd').value.trim().toUpperCase();let hit=null;for(const u of S.users.filter(x=>x.active&&x.role==='مدير'&&x.rh))if(await sha(u.rs+code)===u.rh)hit=u;if(!hit){failed();bad('رمز الاسترداد غير صحيح')}const k=await mkPin($('#rpn').value),rc=genCode(),rs=uid();await rawPut('users',{...hit,...k,rs,rh:await sha(rs+rc)});await log('استرداد حساب المدير','sys',{label:hit.name});L.innerHTML=`<h2>تم تعيين الرمز</h2><p>رمز الاسترداد الجديد (احفظه):</p><div id="newrc" style="font-size:22px;direction:ltr;letter-spacing:2px">${rc}</div><button class="btn" id="rok">متابعة</button>`;$('#rok').onclick=showLogin}catch(e){toast(e.message,'er')}}}

function editUser(id){const o=S.users.find(x=>x.id===id)||{role:'إداري',active:true,cats:[],perms:{players:true,matches:true,training:true,reports:true}};
 const m=modal(id?'تعديل مستخدم':'مستخدم جديد',fields([{k:'name',l:'الاسم',r:1},{k:'role',l:'الدور',t:'select',o:ROLES},{k:'pin',l:id?'رمز جديد (اتركه فارغًا للإبقاء)':'الرمز (4 إلى 6 أرقام)',t:'password',r:!id}],o)+`<div id="uc"><h2>الفئات المصرح بها للمدرب</h2>${S.categories.map(c=>`<label class="ck"><input type="checkbox" name="c_${c.id}"${(o.cats||[]).includes(c.id)?' checked':''}>${esc(c.name)}</label>`).join('')}</div><div id="up"><h2>صلاحيات الموظف الإداري</h2>${PERMK.map(k=>`<label class="ck"><input type="checkbox" name="p_${k}"${o.perms?.[k]?' checked':''}>${PN[k]}</label>`).join('')}</div>`+(id?`<label class="ck"><input type="checkbox" name="active"${o.active?' checked':''}>الحساب مفعّل</label>`:''),

VAL.kits=o=>{if(!o.name?.trim())bad('اسم الطقم مطلوب');if(!KT.includes(o.type))bad('نوع الطقم غير صحيح');(o.sponsors||[]).forEach(i=>{if(!S.sponsors.some(s=>s.id===i))bad('راعٍ غير موجود')})};
VAL.jerseys=o=>{const p=S.players.find(x=>x.id===o.pid);if(!p)bad('اللاعب غير موجود');const n=Number(o.number);if(o.number===''||!Number.isInteger(n)||n<0||n>99)bad('رقم القميص بين 0 و99');if(!SZ.includes(o.size))bad('مقاس غير صحيح');if(!JDS.includes(o.deliveryStatus))bad('حالة التسليم غير صحيحة');if(!JST.includes(o.state))bad('حالة القميص غير صحيحة');
 if(o.deliveryStatus==='مسلّم'&&!okDate(o.deliveredDate))bad('اكتب تاريخ التسليم');if(o.deliveredDate&&o.deliveredDate>today())bad('تاريخ التسليم غير صحيح');if(o.deliveryStatus==='مُعاد'&&(!okDate(o.returnedDate)||(o.deliveredDate&&o.returnedDate<o.deliveredDate)))bad('تاريخ الإرجاع غير صحيح');
 if(o.deliveryStatus!=='مُعاد'){if(S.jerseys.some(j=>j.id!==o.id&&j.pid!==o.pid&&j.cat===o.cat&&Number(j.number)===n&&j.deliveryStatus!=='مُعاد'))bad('رقم القميص '+n+' مستخدم لقميص لاعب آخر في نفس الفئة');if(S.players.some(x=>x.id!==o.pid&&x.cat===o.cat&&x.jersey!==''&&x.jersey!=null&&Number(x.jersey)===n))bad('رقم القميص '+n+' مستخدم لدى لاعب آخر في نفس الفئة')}};
function editKit(id){const o=S.kits.find(x=>x.id===id)||{type:KT[0],sponsors:[]};let f1=o.front||'',f2=o.back||'';
 const m=modal(id?'تعديل طقم':'طقم جديد','<label>الصورة الأمامية</label><input type="file" accept="image/*" id="pf1"><label>الصورة الخلفية</label><input type="file" accept="image/*" id="pf2">'+fields([{k:'name',l:'اسم الطقم',r:1},{k:'type',l:'النوع',t:'select',o:KT},{k:'season',l:'الموسم',t:'select',o:[['','—'],...S.seasons.map(s=>[s.id,s.name])]},{k:'maker',l:'الشركة المصنعة'},{k:'colors',l:'الألوان'},{k:'placements',l:'أماكن الشعارات'},{k:'notes',l:'ملاحظات',t:'textarea'}],o)+(S.sponsors.length?'<h2>شعارات الرعاة</h2>'+S.sponsors.map(s=>`<label class="ck"><input type="checkbox" name="sp_${s.id}"${(o.sponsors||[]).includes(s.id)?' checked':''}>${esc(s.name)}</label>`).join(''):''),async v=>{await save('kits',{...o,name:v.name,type:v.type,season:v.season,maker:v.maker,colors:v.colors,placements:v.placements,notes:v.notes,sponsors:S.sponsors.filter(s=>v['sp_'+s.id]).map(s=>s.id),front:f1,back:f2});toast('تم الحفظ');setTimeout(kitsHome,50)});
 m.querySelector('#pf1').onchange=async e=>{f1=await photo(e.target.files[0])||f1};m.querySelector('#pf2').onchange=async e=>{f2=await photo(e.target.files[0])||f2}}
function editJersey(id,pid){const o=S.jerseys.find(x=>x.id===id)||{pid,size:'M',deliveryStatus:'لم يُسلّم',state:'جديد'};const P=S.players.filter(p=>!p.archived&&vis(p.cat));if(!id&&!pid&&!P.length){toast('لا يوجد لاعبون','er');return}
 const pl=S.players.find(x=>x.id===(o.pid||P[0]?.id));const m=modal(id?'تعديل قميص':'قميص لاعب',fields([{k:'pid',l:'اللاعب',t:'select',o:P.map(p=>[p.id,p.name])},{k:'number',l:'الرقم',t:'number',r:1,d:o.number??pl?.jersey??''},{k:'name',l:'الاسم على القميص',d:o.name||pl?.name||''},{k:'size',l:'المقاس',t:'select',o:SZ},{k:'kitId',l:'الطقم',t:'select',o:[['','—'],...S.kits.map(k=>[k.id,k.name])]},{k:'deliveryStatus',l:'حالة التسليم',t:'select',o:JDS},{k:'state',l:'الحالة الحالية',t:'select',o:JST},{k:'deliveredDate',l:'تاريخ التسليم',t:'date'},{k:'returnedDate',l:'تاريخ الإرجاع',t:'date'}],{...o,pid:o.pid||P[0]?.id}),async v=>{const p=S.players.find(x=>x.id===v.pid);await save('jerseys',{...o,pid:v.pid,cat:p.cat,number:v.number===''?'':Number(v.number),name:v.name,size:v.size,kitId:v.kitId,deliveryStatus:v.deliveryStatus,state:v.state,deliveredDate:v.deliveredDate,returnedDate:v.returnedDate});toast('تم الحفظ');setTimeout(()=>{ksec='j';kitsHome()},50)})}
function kitsHome(){const m=modal('الأطقم والقمصان',`<div class="tabs"><button type="button" class="${ksec==='k'?'on':''}" id="tk">الأطقم</button><button type="button" class="${ksec==='j'?'on':''}" id="tj">قمصان اللاعبين</button></div><div id="kb"></div>`,null);
 const draw=()=>{m.querySelector('#kb').innerHTML=ksec==='k'?(S.kits.map(k=>`<div class="card row" data-k="${k.id}">${k.front?`<img src="${k.front}" style="width:44px;height:44px;border-radius:10px;object-fit:cover" alt="">`:''}<div class="sp"><b>${esc(k.name)}</b><div class="m">${k.type}${k.maker?' · '+esc(k.maker):''}${k.season?' · '+esc(S.seasons.find(s=>s.id===k.season)?.name||''):''}${(k.sponsors||[]).length?' · '+k.sponsors.length+' رعاة':''}</div></div></div>`).join('')||empty('shirt','لا توجد أطقم بعد'))+`<button type="button" class="btn" id="nk">${ic('plus')} طقم جديد</button>`:(S.jerseys.filter(j=>vis(j.cat)).sort((a,b)=>a.cat.localeCompare(b.cat)||Number(a.number)-Number(b.number)).map(j=>`<div class="card row" data-j="${j.id}"><b style="font-size:20px;min-width:36px">${j.number}</b><div class="sp"><b>${esc(S.players.find(p=>p.id===j.pid)?.name||'—')}</b><div class="m">${esc(catName(j.cat))} · ${j.size} · ${j.state}${j.kitId?' · '+esc(S.kits.find(k=>k.id===j.kitId)?.name||''):''}</div></div><span class="bd ${j.deliveryStatus==='مسلّم'?'ok':j.deliveryStatus==='مُعاد'?'':'wa'}">${j.deliveryStatus}</span></div>`).join('')||empty('shirt','لا توجد قمصان مسجلة'))+`<button type="button" class="btn" id="nj">${ic('plus')} قميص لاعب</button>`;icons();
  m.querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>{m.remove();editKit(c.dataset.k)});m.querySelectorAll('[data-j]').forEach(c=>c.onclick=()=>{m.remove();editJersey(c.dataset.j)});const nk=m.querySelector('#nk'),nj=m.querySelector('#nj');if(nk)nk.onclick=()=>{m.remove();editKit()};if(nj)nj.onclick=()=>{m.remove();editJersey()}};
 m.querySelector('#tk').onclick=()=>{ksec='k';m.querySelector('#tk').classList.add('on');m.querySelector('#tj').classList.remove('on');draw()};m.querySelector('#tj').onclick=()=>{ksec='j';m.querySelector('#tj').classList.add('on');m.querySelector('#tk').classList.remove('on');draw()};draw()}
addSrch('kits','الأطقم والقمصان',(q,f)=>!can('players')?[]:[...S.kits.filter(k=>[k.name,k.type,k.maker,k.colors].some(x=>String(x??'').toLowerCase().includes(q))).map(k=>({t:'طقم',title:k.name,sub:k.type,go:`editKit('${k.id}')`})),...S.jerseys.filter(j=>vis(j.cat)&&(!f.cat||j.cat===f.cat)&&[j.number,j.name,S.players.find(p=>p.id===j.pid)?.name].some(x=>String(x??'').toLowerCase().includes(q))).map(j=>({t:'قميص',title:'#'+j.number+' · '+(S.players.find(p=>p.id===j.pid)?.name||''),sub:catName(j.cat)+' · '+j.deliveryStatus,go:`editJersey('${j.id}')`}))]);

/* ===== Backup / Restore / Export ===== */
async function backup(){if(!can('backup'))return toast('ليس لديك صلاحية النسخ الاحتياطي','er');const data={};STORES.forEach(s=>data[s]=S[s]);const body=JSON.stringify(data),file={app:'NOUNSTAR',version:1,date:new Date().toISOString(),checksum:await sha(body),data};dl(JSON.stringify(file),`nounstar-backup-${today()}.json`,'application/json');await log('إنشاء نسخة احتياطية','sys',{label:''});toast('تم إنشاء النسخة الاحتياطية')}
async function restore(f){if(!f)return;if(accOn()&&me()?.role!=='مدير'){const rf=$('#rf');if(rf)rf.value='';return toast('الاستعادة للمدير فقط','er')}try{const j=JSON.parse(await f.text());if(j.app!=='NOUNSTAR'||j.version!==1||!j.data)bad('ملف غير صالح');if(await sha(JSON.stringify(j.data))!==j.checksum)bad('الملف تالف: فشل التحقق من checksum');if(!['categories','players','matches','payments','settings'].every(s=>Array.isArray(j.data[s])))bad('بنية الملف غير صحيحة');
 if(!await ask('تحذير: سيتم استبدال كل البيانات الحالية بمحتوى الملف ولا يمكن التراجع. هل تريد المتابعة؟'))return;for(const s of STORES){await tx(s,'readwrite',o=>o.clear());for(const r of j.data[s]||[])await tx(s,'readwrite',o=>o.put(r))}await load();await migrate();await log('استعادة نسخة احتياطية','sys',{label:f.name});if(accOn()){SID=null;showLogin()}R();toast('تمت الاستعادة')}catch(e){toast(e.message||'ملف غير صالح','er')}{const rf=$('#rf');if(rf)rf.value=''}}
function dl(txt,name,type){if(window.Android){Android.saveFile(name,type,'\ufeff'+txt);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type}));a.download=name;a.click()}
function csv(){const r=[['الاسم','الفئة','الرقم','المركز','الحالة','الهاتف','ولي الأمر','الأهداف','التمريرات','المباريات']].concat(S.players.filter(p=>vis(p.cat)).map(p=>{const s=pStats(p.id);return[p.name,catName(p.cat),p.jersey,p.pos,p.status,can('contacts')?p.phone:'',can('contacts')?p.gphone:'',s.g,s.a,s.m]}));dl(r.map(x=>x.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'players.csv','text/csv')}
/* ===== Theme / PIN ===== */
function theme(){const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('ns_theme',n)}catch(e){}}
async function pinSet(){const c=cfg();modal(c.pin?'إدارة PIN':'تفعيل PIN',`<label>PIN جديد (4-6 أرقام)${c.pin?' — اتركه فارغًا للتعطيل':''}</label><input name="p" type="password" inputmode="numeric" maxlength="6" ${c.pin?'':'required'}>`,async v=>{if(!v.p){delete c.pin;await save('settings',c);return toast('تم تعطيل PIN')}if(!/^\d{4,6}$/.test(v.p))bad('PIN يجب أن يكون 4 إلى 6 أرقام');const salt=uid();c.pin={salt,hash:await sha(salt+v.p)};await save('settings',c);toast('تم تفعيل PIN');idle()})}
async function unlock(){const c=cfg();if(await sha(c.pin.salt+$('#pin').value)===c.pin.hash){$('#lock').style.display='none';$('#pin').value='';idle()}else toast('PIN غير صحيح','er')}
let it;function lockNow(){document.querySelectorAll('.ov').forEach(o=>o.remove());if(accOn()){SID=null;showLogin()}else if(cfg().pin){$('#lock').innerHTML=LOCK0;$('#lock').style.display='flex'}}
function idle(){clearTimeout(it);if((accOn()&&me())||cfg().pin)it=setTimeout(lockNow,120000)}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{if($('#lock').style.display!=='flex')idle()}));
/* ===== Init ===== */
(async()=>{try{const t=localStorage.getItem('ns_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
 try{db=await open();await load();await migrate();R()}catch(e){$('#main').innerHTML=empty('alert-triangle','تعذر فتح قاعدة البيانات المحلية. افتح الملف في متصفح يدعم IndexedDB.')}
 setTimeout(()=>{$('#splash').style.transition='opacity .4s';$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),400);if(accOn())showLogin();else if(cfg().pin)$('#lock').style.display='flex'},2400)})();
